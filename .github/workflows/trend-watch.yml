name: Trend Candidate Watch

on:
  schedule:
    # 每 30 分钟扫描一次，有信号即推送（同日同币去重）
    # 2026-09-08：原 */15 被 GitHub 节流到实际 4-5h 一次，改 30min 提高准时性
    # 实际节拍由外部 cron-job 每 15 分钟 workflow_dispatch 驱动
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendwatch-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Run trend candidate scanner
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || '' }}
        run: python scan_trend.py

      - name: Commit dedup state
        if: success()
        run: |
          if [ -f .need_commit ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pushed_state.json
            git commit -m "chore: update trendwatch dedup state [skip ci]" || echo "nothing to commit"
            git push
          fi

  # 【临时】逐门诊断：统计每道门各淘汰多少币，写 gate_diag.md（定位“为何无推送”，判定用后即撤）
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Gate diagnostics
        run: python diag_gates.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gate_diag.md
          if git diff --staged --quiet; then echo "no report change"; exit 0; fi
          git commit -m "chore: gate diagnostics [skip ci]"
          git pull --rebase origin main || true
          git push
