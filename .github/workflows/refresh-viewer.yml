name: OKX Viewer Refresh

# 用途：让「OKX 数据查看器」（https://yyycjj.github.io/okx-monitor/ 的 index.html）重新自动更新。
#
# 背景（2026-09-22 排查）：
#   这个页面原先由 Monitor Schedule 工作流生成（analysis/*.py → okx_data/viewer.html → gh-pages/index.html），
#   但该工作流的 schedule 已在 2026-09-06 停用（只留 workflow_dispatch，因为主监控的整点推送被关闭），
#   没人手动触发 → 页面数据停在 2026-08-10，一个多月没动。
#   本工作流把「采集 → 生成 → 发布」拆出来单独跑，**只重建页面，不发任何推送**。
#
# 触发方式（2026-09-22 定）：
#   不用 GitHub 自带的 schedule —— 本仓库实测 schedule 会被严重节流（trend-watch 的 */30 曾被拖成几小时一次），
#   新建的 scheduled workflow 首次触发也迟迟不来。改为挂在 **Trend Candidate Watch 的完成事件**上：
#   那个工作流由外部 cron-job 每 15 分钟 workflow_dispatch 驱动（节拍稳定、用户已在用），
#   它一跑完就触达这里，再由下面的时间闸门把实际执行压到「每 2 小时一次」。
#   好处：沿用已验证的节拍，且本工作流有独立的 concurrency，不会拖慢 TrendWatch 自己。
#
# 执行节流：只在 **CST 偶数小时的前 15 分钟内**真正干活（08/10/12/14/16/18/20/22 点各一次）。
#   15 分钟节拍下，每个偶数小时必定有至少一次落在 0-14 分 → 稳定命中；其余触发直接跳过（只花几秒）。
#   想改频率/时段，只改 gate 里那一行 if。
#
# 为什么不直接恢复 Monitor Schedule 的 schedule：
#   那条链路会跑 okx_monitor.py 并注入 PUSHPLUS_TOKEN（= 会推送），与「只保留 TrendWatch 推送」的现状冲突。
#   这里的静默做法有代码依据：okx_monitor.py 的 send_report() / send_high_alert() 在
#   PUSHPLUS_TOKEN 与 WECOM_WEBHOOK 都为空时**直接 return False**；而写 CSV（save_scan_csv）
#   与推送彼此独立。所以只要不注入这两个变量，就是「只记录、不打扰」。
#
# 注意：gh-pages 被多个工作流共用（本文件 + trend-watch.yml 的 charts job + monitor-schedule.yml），
#   三方都用「孤儿提交 + force push」，因此**每一方都必须保留对方的文件**，否则会互相删掉。
#   本工作流保留 charts.html / charts_data.json；trend-watch 那边保留 index.html。

on:
  workflow_run:
    # 挂在 TrendWatch 的完成事件上（它由外部 cron-job 每 15 分钟驱动）
    workflows: ["Trend Candidate Watch"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-viewer
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Throttle (2h, CST even hours, first 15 min)
        run: |
          now=$(TZ=Asia/Shanghai date '+%F %H:%M')
          H=$(TZ=Asia/Shanghai date +%H)
          M=$(TZ=Asia/Shanghai date +%M)
          if [ $((10#$H % 2)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; then
            echo "run=1" >> $GITHUB_OUTPUT
            echo "▶ [$now CST] 命中节流窗口（偶数小时前 15 分钟），开始刷新数据查看器"
          else
            echo "run=0" >> $GITHUB_OUTPUT
            echo "⏭ [$now CST] 未到刷新窗口（每 2 小时一次：CST 08/10/12/14/16/18/20/22 点的头 15 分钟），本轮跳过"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Get date
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # 把当天已采集的 CSV 取回来，这样一天多次运行是**追加**而不是覆盖
      - name: Download today's existing CSV
        uses: actions/download-artifact@v4
        with:
          name: scan-data-${{ steps.date.outputs.date }}
          path: okx_data/scans/
        continue-on-error: true

      # 静默扫描：**刻意不注入** PUSHPLUS_TOKEN / WECOM_WEBHOOK
      - name: Scan (record only, no push)
        run: python okx_monitor.py

      # 历史回测分析 + 生成查看器（顺序不能改：前者产出后者要读的 json）
      - name: Build viewer
        run: |
          python analysis/entry_exit_analysis.py
          python analysis/pairwise_winrate.py
          python analysis/build_viewer.py
          ls -la okx_data/viewer.html

      - name: Upload scan CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-data-${{ steps.date.outputs.date }}
          path: okx_data/scans/${{ steps.date.outputs.date }}.csv
          if-no-files-found: warn
          overwrite: true

      - name: Publish viewer to gh-pages (keep charts)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "OKX Bot"
          git config --global user.email "bot@okx.local"

          rm -rf /tmp/pub && mkdir -p /tmp/pub

          # 先把 gh-pages 上已有的走势图文件带回来，避免本次发布把它们删掉
          git fetch --depth=1 origin gh-pages || true
          for f in charts.html charts_data.json; do
            if git show "origin/gh-pages:$f" > "/tmp/pub/$f" 2>/dev/null; then
              echo "kept $f ($(wc -c < /tmp/pub/$f) bytes)"
            else
              rm -f "/tmp/pub/$f"
              echo "no existing $f on gh-pages"
            fi
          done

          cp okx_data/viewer.html /tmp/pub/index.html
          du -h /tmp/pub/*

          cd /tmp/pub
          git init -q -b gh-pages
          git add -A
          git commit -q -m "chore: refresh OKX viewer [skip ci]"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published index.html to gh-pages"
