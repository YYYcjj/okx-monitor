name: Oversold Scanner

on:
  schedule:
    # every 30min during CST 6-23 (UTC 22,0,2,4,6,8,10,12,14)
    - cron: '*/30 0,2,4,6,8,10,12,14,22 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Run oversold scanner
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || '' }}
        run: python scan_oversold.py
