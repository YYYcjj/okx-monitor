name: Watchlist Push

on:
  workflow_dispatch:   # 2026-09-06：A 主监控已停用自动触发，只保留 TrendWatch(每15min)。

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Run watchlist push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || '' }}
        run: python push_watchlist.py
