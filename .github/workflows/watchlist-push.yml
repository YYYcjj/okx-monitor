name: Watchlist Push

on:
  schedule:
    # 每天 08:00 / 16:00 CST → UTC 0,8 点（2026-09-06 降频为每天两次）
    - cron: '0 0,8 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Run watchlist push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || '' }}
        run: python push_watchlist.py
