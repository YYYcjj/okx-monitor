name: Watchlist Push

on:
  schedule:
    # 每天 08:00 CST（= UTC 00:00）推送一次（2026-09-19 由每天两次降为一天一次）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Run watchlist push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || '' }}
        run: python push_watchlist.py
