name: OKX 策略监控

on:
  workflow_dispatch:  # 手动触发
  # schedule disabled — only extreme SRSI pushes now

permissions:
  contents: write  # 允许推送冷却状态 & 扫描数据

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests urllib3 --quiet

      - name: Run monitor
        id: monitor
        run: python okx_monitor.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || '' }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK || '' }}

      - name: Commit cooldown state
        if: always()
        run: |
          git config user.name "OKX Bot"
          git config user.email "bot@okx.local"
          git add .cooldown.json okx_data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No cooldown changes"
          else
            git commit -m "[auto] 冷却状态 & 扫描数据" && git push
          fi
